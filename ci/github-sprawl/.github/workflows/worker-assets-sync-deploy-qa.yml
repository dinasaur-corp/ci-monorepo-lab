name: "worker / assets-sync / deploy / qa"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to promote
        required: true
        default: main

concurrency:
  group: assets-sync-qa
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: [self-hosted, azure-vnet, large]
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @lab/assets-sync build
      - run: pnpm --filter @lab/assets-sync exec wrangler deploy --env qa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_QA }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
