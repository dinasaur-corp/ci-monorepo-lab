name: "worker / redirects / pr"

on:
  pull_request:
    paths:
      - "workers/redirects/**"
      - "packages/config/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/worker-redirects-pr.yml"
      - ".github/actions/setup/**"

concurrency:
  group: redirects-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: [self-hosted, azure-vnet, large]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @lab/redirects lint
      - run: pnpm --filter @lab/redirects test
      - run: pnpm --filter @lab/redirects exec wrangler deploy --dry-run --env test
