name: "worker / image-manager / pr"

on:
  pull_request:
    paths:
      - "workers/image-manager/**"
      - "packages/config/**"
      - "packages/image-core/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/worker-image-manager-pr.yml"
      - ".github/actions/setup/**"

concurrency:
  group: image-manager-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: [self-hosted, azure-vnet, large]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @lab/image-manager lint
      - run: pnpm --filter @lab/image-manager test
      - run: pnpm --filter @lab/image-manager exec wrangler deploy --dry-run --env test
