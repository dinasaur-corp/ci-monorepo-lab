name: "worker / coworker-channel / pr"

on:
  pull_request:
    paths:
      - "workers/coworker-channel/**"
      - "packages/config/**"
      - "packages/shared/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/worker-coworker-channel-pr.yml"
      - ".github/actions/setup/**"

concurrency:
  group: coworker-channel-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: [self-hosted, azure-vnet, large]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @lab/coworker-channel lint
      - run: pnpm --filter @lab/coworker-channel test
      - run: pnpm --filter @lab/coworker-channel exec wrangler deploy --dry-run --env test
