name: "worker / redirects / deploy / preprod"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to promote
        required: true
        default: main

concurrency:
  group: redirects-preprod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: [self-hosted, azure-vnet, large]
    environment: preprod  # required reviewers configured in GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @lab/redirects build
      - run: pnpm --filter @lab/redirects exec wrangler deploy --env preprod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREPROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
