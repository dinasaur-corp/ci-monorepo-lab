name: "worker / coworker-channel / deploy / prod"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to promote
        required: true
        default: main

concurrency:
  group: coworker-channel-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: [self-hosted, azure-vnet, large]
    environment: prod  # required reviewers configured in GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @lab/coworker-channel build
      - run: pnpm --filter @lab/coworker-channel exec wrangler deploy --env prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
