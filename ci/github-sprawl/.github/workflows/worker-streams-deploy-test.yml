name: "worker / streams / deploy / test"

on:
  push:
    branches: [main]
    paths:
      - "workers/streams/**"
      - "packages/config/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/worker-streams-deploy-test.yml"
      - ".github/actions/setup/**"
  workflow_dispatch:

concurrency:
  group: streams-test
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: [self-hosted, azure-vnet, large]
    environment: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @lab/streams build
      - run: pnpm --filter @lab/streams exec wrangler deploy --env test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_TEST }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
