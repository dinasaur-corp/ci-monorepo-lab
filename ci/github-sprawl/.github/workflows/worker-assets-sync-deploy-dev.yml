name: "worker / assets-sync / deploy / dev"

on:
  push:
    branches: [main]
    paths:
      - "workers/assets-sync/**"
      - "packages/config/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/worker-assets-sync-deploy-dev.yml"
      - ".github/actions/setup/**"
  workflow_dispatch:

concurrency:
  group: assets-sync-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: [self-hosted, azure-vnet, large]
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @lab/assets-sync build
      - run: pnpm --filter @lab/assets-sync exec wrangler deploy --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
