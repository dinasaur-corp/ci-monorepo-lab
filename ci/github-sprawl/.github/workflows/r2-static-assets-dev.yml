name: "assets / r2 / dev"

on:
  push:
    branches: [main]
    paths:
      - "workers/assets-sync/public/**"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - run: pnpm dlx wrangler r2 object put ikea-static-dev/favicon.ico --file workers/assets-sync/public/favicon.ico
