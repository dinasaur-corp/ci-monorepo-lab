name: "worker / assets-sync / pr"

on:
  pull_request:
    paths:
      - "workers/assets-sync/**"
      - "packages/config/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/worker-assets-sync-pr.yml"
      - ".github/actions/setup/**"

concurrency:
  group: assets-sync-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: [self-hosted, azure-vnet, large]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @lab/assets-sync lint
      - run: pnpm --filter @lab/assets-sync test
      - run: pnpm --filter @lab/assets-sync exec wrangler deploy --dry-run --env test
