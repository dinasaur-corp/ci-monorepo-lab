name: "worker / streams / pr"

on:
  pull_request:
    paths:
      - "workers/streams/**"
      - "packages/config/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/worker-streams-pr.yml"
      - ".github/actions/setup/**"

concurrency:
  group: streams-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: [self-hosted, azure-vnet, large]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @lab/streams lint
      - run: pnpm --filter @lab/streams test
      - run: pnpm --filter @lab/streams exec wrangler deploy --dry-run --env test
