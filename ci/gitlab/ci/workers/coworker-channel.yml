.coworker-channel-changes: &coworker-channel-changes
  changes:
    paths:
      - "workers/coworker-channel/**"
      - "packages/config/**"
      - "packages/shared/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"

verify:coworker-channel:
  extends: .verify-worker
  variables: { WORKER: coworker-channel }
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      <<: *coworker-channel-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      <<: *coworker-channel-changes

deploy:coworker-channel:dev:
  extends: .deploy-worker
  stage: dev
  environment: dev
  variables: { WORKER: coworker-channel }
  needs: ["verify:coworker-channel"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      <<: *coworker-channel-changes

deploy:coworker-channel:test:
  extends: .deploy-worker
  stage: test
  environment: test
  variables: { WORKER: coworker-channel }
  needs: ["deploy:coworker-channel:dev"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      <<: *coworker-channel-changes

deploy:coworker-channel:qa:
  extends: .deploy-worker
  stage: qa
  environment: qa
  variables: { WORKER: coworker-channel }
  needs: ["deploy:coworker-channel:test"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      <<: *coworker-channel-changes

deploy:coworker-channel:stage:
  extends: .deploy-worker
  stage: stage
  environment: stage
  variables: { WORKER: coworker-channel }
  needs: ["deploy:coworker-channel:qa"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      <<: *coworker-channel-changes

deploy:coworker-channel:preprod:
  extends: .deploy-worker
  stage: preprod
  environment: preprod
  variables: { WORKER: coworker-channel }
  needs: ["deploy:coworker-channel:stage"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      <<: *coworker-channel-changes
      when: manual

deploy:coworker-channel:prod:
  extends: .deploy-worker
  stage: prod
  environment: prod
  variables: { WORKER: coworker-channel }
  needs: ["deploy:coworker-channel:preprod"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      <<: *coworker-channel-changes
      when: manual
